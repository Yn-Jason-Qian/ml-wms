server:
  port: 8080
  servlet:
    context-path: /
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  profiles:
    active: dev
  application:
    name: wms-server

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    default-property-inclusion: non_null

  data:
    redis:
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.wms.**.domain.entity
  global-config:
    db-config:
      id-type: ASSIGN_ID
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
    default-enum-type-handler: org.apache.ibatis.type.EnumTypeHandler

jwt:
  # 生产环境请通过 JWT_SECRET 环境变量覆盖（参见 .env.example 与 SECURITY.md）
  secret: ${JWT_SECRET:your-256-bit-secret-key-change-in-production}
  expiration: 86400000

hashids:
  salt: wms-hashid-salt-2026
  min-length: 8

springdoc:
  swagger-ui:
    path: /swagger-ui.html
knife4j:
  # 注意：knife4j 4.5.0 的 Knife4jOpenApiCustomizer 调用了 springdoc 2.4+ 已移除的
  # SpringDocConfigProperties.getGroupConfigs()，开启后会与 Spring Boot 3.4+/3.5 冲突
  # （/v3/api-docs 抛 NoSuchMethodError）。因此关闭增强功能，仅保留其 UI 静态资源，
  # 接口文档仍可通过 /doc.html 访问。
  enable: false
  setting:
    enable-footer: false
