name: CI

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]
  workflow_dispatch:

# 同一分支连续推送时，取消上一次未跑完的运行
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 后端: 编译 + 单元测试 + 代码格式校验 ──
  backend:
    name: 后端 (build + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # 单元测试为纯内存测试，不需要 MySQL / Redis
      # install 会同时触发 fmt-maven-plugin 的格式校验
      - name: mvn install
        working-directory: wms-server
        run: mvn -B -ntp install

      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: wms-server/**/target/surefire-reports/
          if-no-files-found: ignore

  # ── PC 前端: 构建 ──
  web:
    name: 前端 wms-web (build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: wms-web/package-lock.json

      - name: npm ci
        working-directory: wms-web
        run: npm ci --legacy-peer-deps

      - name: npm run build
        working-directory: wms-web
        run: npm run build

  # ── PDA 前端: 构建 ──
  # wms-pda 依赖 uni-app alpha 工具链，构建稳定性不如 PC 端，
  # 因此标记为非阻断（失败只提示，不阻止 PR 合并）。工具链稳定后可去掉 continue-on-error。
  pda:
    name: 前端 wms-pda (build, 非阻断)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: wms-pda/package-lock.json

      - name: npm ci
        working-directory: wms-pda
        run: npm ci --legacy-peer-deps

      - name: npm run build:mp-weixin
        working-directory: wms-pda
        run: npm run build:mp-weixin
