# ── 依赖更新策略：小版本/补丁分组自动升级，大版本单独开 PR ──
#
# 为什么要分组：首次启用时 Dependabot 一次刷出 19 个 PR，很难处理。现在：
#   - minor / patch 更新 → 按生态合并成一个 PR（噪音小，通常可以直接合）
#   - major 更新        → 单独开 PR，需要人工评估（例如 Spring Boot 3.3 → 4.1、vite 6 → 8）
#
# 若只想保留 CVE 驱动的安全更新、完全不要版本升级 PR：
#   把各段落的 open-pull-requests-limit 改成 0，
#   并在仓库 Settings → Security 中开启 Dependabot alerts / security updates。
version: 2
updates:
  # 后端 Maven 依赖
  - package-ecosystem: maven
    directory: /wms-server
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: [dependencies]
    groups:
      maven-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  # PC 前端
  - package-ecosystem: npm
    directory: /wms-web
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: [dependencies]
    groups:
      web-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  # PDA 前端
  - package-ecosystem: npm
    directory: /wms-pda
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: [dependencies]
    groups:
      pda-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  # GitHub Actions 自身（都是小版本，整体合并）
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    labels: [dependencies]
    groups:
      actions:
        patterns: ["*"]
