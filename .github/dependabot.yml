version: 2
updates:
  # 后端 Maven 依赖
  - package-ecosystem: maven
    directory: /wms-server
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: [dependencies]

  # PC 前端
  - package-ecosystem: npm
    directory: /wms-web
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: [dependencies]

  # PDA 前端
  - package-ecosystem: npm
    directory: /wms-pda
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: [dependencies]

  # 让 GitHub Actions 自身保持更新
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels: [dependencies]
