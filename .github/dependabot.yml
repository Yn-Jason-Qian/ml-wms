# ── 依赖更新策略：只保留安全更新 ──
#
# open-pull-requests-limit: 0 表示**不再自动开版本升级 PR**（首次启用时它一次刷出了 19 个，
# 含 Spring Boot 3.3 → 4.1 这类跨大版本的升级），但 CVE 驱动的「安全更新」不受此限制，仍会开 PR。
#
# 注意：安全更新还需在仓库设置里打开：
#   Settings → Security → Dependabot alerts / Dependabot security updates
#
# 想恢复常规的版本升级 PR 时，把各段落的 open-pull-requests-limit 改回 5 即可
# （建议同时加 groups 按 minor/patch 分组，避免刷屏）。
version: 2
updates:
  # 后端 Maven 依赖
  - package-ecosystem: maven
    directory: /wms-server
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    labels: [dependencies, security]

  # PC 前端
  - package-ecosystem: npm
    directory: /wms-web
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    labels: [dependencies, security]

  # PDA 前端
  - package-ecosystem: npm
    directory: /wms-pda
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    labels: [dependencies, security]

  # GitHub Actions 自身
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    labels: [dependencies, security]
