version: 2
updates:
  # 后端 Maven 依赖
  - package-ecosystem: maven
    directory: /wms-server
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: [dependencies]
    groups:
      # 小版本与补丁合并成一个 PR，避免刷屏；大版本仍单独开 PR，便于逐个评估
      maven-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  # PC 前端
  - package-ecosystem: npm
    directory: /wms-web
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: [dependencies]
    groups:
      web-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  # PDA 前端
  - package-ecosystem: npm
    directory: /wms-pda
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: [dependencies]
    groups:
      pda-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  # 让 GitHub Actions 自身保持更新
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels: [dependencies]
    groups:
      actions:
        patterns: ["*"]
